# /etc/dcagent/dcagent.conf
# Configuration for dcagent.service.
# Installed to /etc/dcagent/dcagent.conf (world-readable, owned by root:root).

# --- Logging ---

# Log level: debug, info, warning, error (default: info)
#DCAGENT_LOG_LEVEL=info

# Write logs to a file in addition to journald
#DCAGENT_LOG_FILE=/var/log/dcagent.log

# --- Pipe ---

# Path to the Unix named pipe for external commands.
# Monitoring scripts write "alert <msg>" or "status <key> <val>" here.
DCAGENT_PIPE_PATH=/run/dcagent/dcagent.pipe

# --- Heartbeat ---

# Heartbeat broadcast interval in seconds (default: 60).
# Set lower (e.g. 30) for faster offline detection at the cost of more traffic.
#DCAGENT_HEARTBEAT=60

# --- Alert scripts ---

# Directory of scripts run periodically by dcagent to generate alerts.
# Each executable in this directory is run by run-parts every DCAGENT_ALERT_INTERVAL seconds.
# Scripts should write "alert <message>" lines to stdout; dcagent captures and dispatches them.
DCAGENT_ALERT_DIR=/etc/dcagent/alert-enabled

# How often to run alert scripts, in seconds (default: 60).
#DCAGENT_ALERT_INTERVAL=60

# --- Status scripts ---

# Directory of scripts run periodically by dcagent to update status.
# Each executable in this directory is run by run-parts every DCAGENT_STATUS_INTERVAL seconds.
# Scripts should write "status <key> <value>" lines to stdout; dcagent captures and dispatches them.
DCAGENT_STATUS_DIR=/etc/dcagent/status-enabled

# How often to run status scripts, in seconds (default: 60).
#DCAGENT_STATUS_INTERVAL=60

# --- Data directory ---

# Override the default config/data directory.
#DCAGENT_CONFIG_DIR=/var/lib/dcagent
