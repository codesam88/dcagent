# /etc/dcagent/dcagent.conf
# Configuration for dcagent.service.
# Installed to /etc/dcagent/dcagent.conf (world-readable, owned by root:root).

# --- Logging ---

# Log level: debug, info, warning, error (default: info)
#DCAGENT_LOG_LEVEL=info

# Write logs to a file in addition to journald
#DCAGENT_LOG_FILE=/var/log/dcagent.log

# --- Pipe ---

# Path to the Unix named pipe for external commands.
# Monitoring scripts write "alert <msg>" or "status <key> <val>" here.
DCAGENT_PIPE_PATH=/run/dcagent/dcagent.pipe

# --- Heartbeat ---

# Heartbeat broadcast interval in seconds (default: 60).
# Set lower (e.g. 30) for faster offline detection at the cost of more traffic.
#DCAGENT_HEARTBEAT=60

# --- Action scripts ---

# Single directory of action scripts (both alerts and status producers).
# Place executables in the AVAILABLE directory and enable them by symlinking
# into the ENABLED directory. These directories are compatible with run-parts.

# Directory containing action scripts provided by packages or local installs
# (e.g. /usr/local/lib/dcagent/actions). These are not run directly by dcagent;
# they serve as a repository for available scripts.
#DCAGENT_ACTION_AVAILABLE=/etc/dcagent/action-available

# Action scripts and cron interval directories are located relative to the
# main configuration file. Set DCAGENT_CONFIG_FILE to point at the installed
# config (e.g. /etc/dcagent/dcagent.conf). The agent derives
# DCAGENT_CONFIG_DIR from the directory containing that file. By default that
# is '/etc/dcagent'.
#DCAGENT_CONFIG_FILE=/etc/dcagent/dcagent.conf
#
# Action scripts should be placed in "$DCAGENT_CONFIG_DIR/actions" and cron
# interval directories in "$DCAGENT_CONFIG_DIR/cron". Do not configure
# separate ACTION/CRON variables.
# How often to run action scripts when managed by dcagent, in seconds (default: 60).
# For infrequent jobs prefer systemd timers or cron; dcagent should be used for
# frequently-run checks.
#DCAGENT_ACTION_INTERVAL=60

# Optional extra config file that action scripts may source for their own
# configuration (overrides values in /etc/dcagent/dcagent.conf when provided).
# Action scripts honour DCAGENT_ACTION_CONF environment variable too.
#DCAGENT_ACTION_CONF=/etc/dcagent/actions.conf

# --- Data directory ---

# Override the default config/data directory.
#DCAGENT_CONFIG_DIR=/var/lib/dcagent
