# /etc/dcagent/dcagent.conf
# Configuration for dcagent.service.
# This file lives in the directory named by DCAGENT_CONFIG_PATH.

# --- Logging ---

# Log level: debug, info, warning, error (default: info)
#DCAGENT_LOG_LEVEL=info

# Write logs to a file in addition to journald
#DCAGENT_LOG_FILE=/var/log/dcagent.log

# --- Pipe ---

# Path to the Unix named pipe for external commands.
# Monitoring scripts write "alert <msg>" or "status <key> <val>" here.
DCAGENT_PIPE_PATH=/run/dcagent/dcagent.pipe

# --- Heartbeat ---

# Heartbeat broadcast interval in seconds (default: 60).
# Set lower (e.g. 30) for faster offline detection at the cost of more traffic.
#DCAGENT_HEARTBEAT=60
