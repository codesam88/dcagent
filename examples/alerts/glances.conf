# glances.conf — example configuration for dcagent alerting
#
# Place in /etc/glances/glances.conf or ~/.config/glances/glances.conf
#
# Glances sanitises shell operators (|, >, &&) in action lines, so piping
# directly to the dcagent named pipe is not possible from here. Instead,
# actions call the companion script glances-dcagent-alert which handles
# the forwarding.
#
# See: https://glances.readthedocs.io/en/latest/aoa/actions.html

[global]
refresh=30

# ── Load ──────────────────────────────────────────────────────────────────────
# Thresholds are expressed as load-per-CPU (glances normalises automatically).

[load]
careful=0.7
warning=1.0
critical=2.0
warning_action=/etc/glances/glances-dcagent-alert "⚠️ load warning: {{min1}} {{min5}} {{min15}}"
critical_action=/etc/glances/glances-dcagent-alert "🔴 load critical: {{min1}} {{min5}} {{min15}}"

# ── Filesystem ────────────────────────────────────────────────────────────────

[fs]
careful=70
warning=85
critical=95
warning_action=/etc/glances/glances-dcagent-alert "⚠️ disk {{mnt_point}} at {{percent}}% (warning)"
critical_action=/etc/glances/glances-dcagent-alert "🔴 disk {{mnt_point}} at {{percent}}% (critical)"

# ── Memory ────────────────────────────────────────────────────────────────────

[mem]
careful=70
warning=85
critical=95
warning_action=/etc/glances/glances-dcagent-alert "⚠️ memory at {{percent}}% (warning)"
critical_action=/etc/glances/glances-dcagent-alert "🔴 memory at {{percent}}% (critical)"
