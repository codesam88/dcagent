# Build and publish release binary for x86_64.
# Triggered by pushing a version tag (e.g. v0.2.0).
#
# aarch64 builds require a self-hosted runner; add one with the
# 'aarch64' label and duplicate this job if needed.

name: release

on:
  push:
    tags: ['v*']

jobs:
  dist:
    runs-on: codeberg-medium

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv

      - name: Build dist
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: dcagent-x86_64.pyz
          path: dist/dcagent-x86_64.pyz

  release:
    needs: dist
    runs-on: codeberg-small

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pyz
          generate_release_notes: true
