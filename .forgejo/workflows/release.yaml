# Build and publish release binary for x86_64.
# Triggered by pushing a version tag (e.g. v0.2.0).
#
# aarch64 builds require a self-hosted runner; add one with the
# 'aarch64' label and duplicate this job if needed.

name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: codeberg-medium

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build dist
        run: make dist && mkdir -p dist/release && mv dist/*.pyz dist/release/

      - uses: actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: dist/release
