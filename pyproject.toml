[project]
name = "dcagent"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deltachat-rpc-server>=2.46.0",
    "deltachat2>=0.9.0",
    "appdirs>=1.4.4",
]

[project.scripts]
dcagent = "dcagent.agent:main"

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "pytest>=8.0.0",
    "pre-commit>=4.0.0",
    "shiv>=1.0.8",
    "hatch-vcs>=0.5.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dcagent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dcagent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort
